<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>仰观 · Yangguan · 仰観</title>
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif;line-height:1.65;max-width:760px;margin:0 auto;padding:32px 20px;color:#1d1d1f;background:#f5f5f7}main{background:#fff;border-radius:16px;padding:28px}h1{font-size:28px;margin:0 0 8px}.language{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 24px}.language button{font:inherit;border:0;border-radius:999px;padding:7px 12px;background:#e8e8ed;color:#1d1d1f}.language button[aria-pressed="true"]{background:#007aff;color:#fff}a{color:#007aff}.localized[hidden]{display:none}
  </style>
</head>
<body><main>
  <h1>仰观 · Yangguan · 仰観</h1>
  <nav class="language" aria-label="Language">
    <button data-lang="zh-Hans">简体中文</button><button data-lang="zh-Hant">繁體中文</button><button data-lang="en">English</button><button data-lang="ja">日本語</button>
  </nav>
  <section class="localized" lang="zh-Hans" data-lang-panel="zh-Hans"><p><a href="privacy/">隐私政策</a></p><p><a href="support/">帮助与支持</a></p><p><a href="terms/">使用条款</a></p></section>
  <section class="localized" lang="zh-Hant" data-lang-panel="zh-Hant"><p><a href="privacy/">隱私權政策</a></p><p><a href="support/">幫助與支援</a></p><p><a href="terms/">使用條款</a></p></section>
  <section class="localized" lang="en" data-lang-panel="en"><p><a href="privacy/">Privacy Policy</a></p><p><a href="support/">Help & Support</a></p><p><a href="terms/">Terms of Use</a></p></section>
  <section class="localized" lang="ja" data-lang-panel="ja"><p><a href="privacy/">プライバシーポリシー</a></p><p><a href="support/">ヘルプとサポート</a></p><p><a href="terms/">利用規約</a></p></section>
</main><script>
  const supported=['zh-Hans','zh-Hant','en','ja'];
  function initialLanguage(){const saved=localStorage.getItem('yangguan-doc-language');if(supported.includes(saved))return saved;const value=(navigator.language||'').toLowerCase();if(value.startsWith('zh-hant')||value.startsWith('zh-tw')||value.startsWith('zh-hk'))return'zh-Hant';if(value.startsWith('zh'))return'zh-Hans';if(value.startsWith('ja'))return'ja';return'en'}
  function showLanguage(language){document.documentElement.lang=language;document.querySelectorAll('[data-lang-panel]').forEach(node=>node.hidden=node.dataset.langPanel!==language);document.querySelectorAll('[data-lang]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.lang===language)));localStorage.setItem('yangguan-doc-language',language)}
  document.querySelectorAll('[data-lang]').forEach(button=>button.addEventListener('click',()=>showLanguage(button.dataset.lang)));showLanguage(initialLanguage());
</script></body></html>
